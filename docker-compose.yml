services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pitfalls
      POSTGRES_USER: pitfalls
      POSTGRES_PASSWORD: pitfalls
    volumes:
      - pitfalls_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitfalls -d pitfalls"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pitfalls:pitfalls@db:5432/pitfalls
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://pitfalls:pitfalls@db:5432/pitfalls
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-me}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  pitfalls_postgres:
